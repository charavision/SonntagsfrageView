plugins { id "com.android.application" }

android {
    namespace "de.charavision.sonntagsfragen"
    compileSdk 35
    buildToolsVersion "35.0.0"

    signingConfigs {
        debug {
            storeFile rootProject.file(".android-home/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "de.charavision.sonntagsfragen"
        minSdk 24
        targetSdk 34
        versionCode 17
        versionName "1.0.16"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
