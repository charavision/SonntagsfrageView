name: Daten aktualisieren und Pages veröffentlichen

on:
  workflow_dispatch:
  schedule:
    # Zweimal täglich. GitHub kann geplante Läufe verzögert starten; deshalb
    # darf der Datenabruf nicht von der tatsächlichen Startstunde abhängen.
    - cron: "1 0,12 * * *"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip
      - if: github.event_name != 'push'
        run: pip install -r requirements.txt
      - name: Wahlrecht-Daten abrufen
        if: github.event_name != 'push'
        run: python scripts/update_data.py
      - name: Aktualisierte Daten speichern
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polls.json
          git diff --cached --quiet || git commit -m "Daten automatisch aktualisieren [skip ci]"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
